version: "3.9"

x-common-env: &common-env
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_USER: ${POSTGRES_USER:-mlops}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mlops_secret}
  POSTGRES_DB: ${POSTGRES_DB:-mlops_db}
  MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-http://mlflow:5000}
  MLFLOW_S3_ENDPOINT_URL: ${MLFLOW_S3_ENDPOINT_URL:-http://minio:9000}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin123}
  MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
  MODEL_NAME: ${MODEL_NAME:-skin-severity-classifier}
  MODEL_STAGE: ${MODEL_STAGE:-Production}
  PYTHONPATH: /app
  PYTHONUNBUFFERED: "1"

services:
  # ─── PostgreSQL ──────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: skin-mlops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mlops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mlops_secret}
      POSTGRES_DB: ${POSTGRES_DB:-mlops_db}
      POSTGRES_MULTIPLE_DATABASES: "mlops_db,airflow_db,metabase_db"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/postgres-init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mlops}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mlops-net

  # ─── MinIO ───────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: skin-mlops-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - mlops-net

  minio-init:
    image: minio/mc:latest
    container_name: skin-mlops-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin123};
      mc mb --ignore-existing local/mlflow-artifacts;
      mc mb --ignore-existing local/dvc-storage;
      mc mb --ignore-existing local/model-artifacts;
      mc mb --ignore-existing local/raw-images;
      mc mb --ignore-existing local/processed-images;
      echo 'MinIO buckets created';
      exit 0;
      "
    networks:
      - mlops-net

  # ─── MLflow ──────────────────────────────────────────────────
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.11.1
    container_name: skin-mlops-mlflow
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      <<: *common-env
    entrypoint: >
      /bin/sh -c "
      pip install --no-cache-dir psycopg2-binary &&
      exec mlflow server
      --backend-store-uri postgresql://${POSTGRES_USER:-mlops}:${POSTGRES_PASSWORD:-mlops_secret}@postgres:5432/${POSTGRES_DB:-mlops_db}
      --default-artifact-root s3://mlflow-artifacts
      --host 0.0.0.0
      --port 5000
      --serve-artifacts
      "
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - mlops-net

  # ─── FastAPI Inference API ────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: skin-mlops-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    environment:
      <<: *common-env
      API_PORT: "8000"
      LOG_PREDICTIONS: "true"
    volumes:
      - ./artifacts:/app/artifacts
      - ./configs:/app/configs:ro
      - ./data/sample:/app/data/sample:ro
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - mlops-net

  # ─── Trainer ─────────────────────────────────────────────────
  trainer:
    build:
      context: .
      dockerfile: training/Dockerfile
    container_name: skin-mlops-trainer
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    environment:
      <<: *common-env
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts
      - ./configs:/app/configs:ro
    profiles:
      - training
    networks:
      - mlops-net

  # ─── Airflow ─────────────────────────────────────────────────
  airflow-init:
    image: apache/airflow:2.8.1-python3.11
    container_name: skin-mlops-airflow-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-mlops}:${POSTGRES_PASSWORD:-mlops_secret}@postgres:5432/airflow_db
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY:-LKpJcq8OI_a0KvBnqpTQbVpGHKB-xBFsVlXlsUm1Rz0=}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY:-skin_severity_mlops_secret}
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin
    entrypoint: /bin/bash
    command: -c "airflow db migrate && airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com || true"
    networks:
      - mlops-net

  airflow-webserver:
    image: apache/airflow:2.8.1-python3.11
    container_name: skin-mlops-airflow-web
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-mlops}:${POSTGRES_PASSWORD:-mlops_secret}@postgres:5432/airflow_db
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY:-LKpJcq8OI_a0KvBnqpTQbVpGHKB-xBFsVlXlsUm1Rz0=}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY:-skin_severity_mlops_secret}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      <<: *common-env
    volumes:
      - ./pipelines/airflow/dags:/opt/airflow/dags:ro
      - airflow_logs:/opt/airflow/logs
      - ./data:/app/data
      - ./artifacts:/app/artifacts
      - ./configs:/app/configs:ro
    ports:
      - "8080:8080"
    command: webserver
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - mlops-net

  airflow-scheduler:
    image: apache/airflow:2.8.1-python3.11
    container_name: skin-mlops-airflow-scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-mlops}:${POSTGRES_PASSWORD:-mlops_secret}@postgres:5432/airflow_db
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY:-LKpJcq8OI_a0KvBnqpTQbVpGHKB-xBFsVlXlsUm1Rz0=}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      <<: *common-env
    volumes:
      - ./pipelines/airflow/dags:/opt/airflow/dags:ro
      - airflow_logs:/opt/airflow/logs
      - ./data:/app/data
      - ./artifacts:/app/artifacts
      - ./configs:/app/configs:ro
    command: scheduler
    networks:
      - mlops-net

  # ─── FiftyOne ────────────────────────────────────────────────
  fiftyone:
    image: voxel51/fiftyone:latest
    container_name: skin-mlops-fiftyone
    restart: unless-stopped
    stdin_open: true
    tty: true
    volumes:
      - ./data:/app/data:ro
      - ./fiftyone_app:/app/fiftyone_app:ro
      - fiftyone_data:/fiftyone
    ports:
      - "5151:5151"
    environment:
      FIFTYONE_DATABASE_URI: mongodb://fiftyone-mongo:27017
    depends_on:
      - fiftyone-mongo
    networks:
      - mlops-net

  fiftyone-mongo:
    image: mongo:6-jammy
    container_name: skin-mlops-fiftyone-mongo
    restart: unless-stopped
    volumes:
      - fiftyone_mongo_data:/data/db
    networks:
      - mlops-net

  # ─── Meltano ─────────────────────────────────────────────────
  meltano:
    image: meltano/meltano:latest
    container_name: skin-mlops-meltano
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./pipelines/meltano:/project
      - ./data:/app/data
    working_dir: /project
    environment:
      <<: *common-env
    entrypoint: ["tail", "-f", "/dev/null"]  # Keep alive for manual runs
    networks:
      - mlops-net

  # ─── Metabase ────────────────────────────────────────────────
  metabase:
    image: metabase/metabase:latest
    container_name: skin-mlops-metabase
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase_db
      MB_DB_PORT: "5432"
      MB_DB_USER: ${POSTGRES_USER:-mlops}
      MB_DB_PASS: ${POSTGRES_PASSWORD:-mlops_secret}
      MB_DB_HOST: postgres
      JAVA_OPTS: "-Xmx512m"
    ports:
      - "3000:3000"
    volumes:
      - metabase_data:/metabase-data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    networks:
      - mlops-net

  # ─── Test Runner ─────────────────────────────────────────────
  test-runner:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: skin-mlops-tests
    environment:
      <<: *common-env
    volumes:
      - ./tests:/app/tests:ro
      - ./training:/app/training:ro
      - ./api:/app/api:ro
      - ./monitoring:/app/monitoring:ro
      - ./configs:/app/configs:ro
      - ./data:/app/data:ro
      - ./fiftyone_app:/app/fiftyone_app:ro
      - ./scripts:/app/scripts:ro
    command: >
      sh -c "pip install pytest pytest-asyncio pytest-cov httpx --quiet &&
             python -m pytest tests/ -v --tb=short --no-header 2>&1"
    profiles:
      - testing
    networks:
      - mlops-net

volumes:
  postgres_data:
  minio_data:
  airflow_logs:
  fiftyone_data:
  fiftyone_mongo_data:
  metabase_data:

networks:
  mlops-net:
    driver: bridge
