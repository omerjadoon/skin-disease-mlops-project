[tool.poetry]
name = "skin-severity-mlops"
version = "0.1.0"
description = "End-to-end MLOps pipeline for skin disease severity classification (educational/research purposes only)"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [
    { include = "training" },
    { include = "api" },
    { include = "monitoring" },
]

[tool.poetry.dependencies]
python = "^3.11"
torch = "^2.2.0"
torchvision = "^0.17.0"
pytorch-lightning = "^2.2.0"
torchmetrics = "^1.3.0"
fastapi = "^0.110.0"
uvicorn = { extras = ["standard"], version = "^0.29.0" }
pydantic = "^2.6.0"
pydantic-settings = "^2.2.0"
mlflow = "2.11.1"
dvc = { extras = ["s3"], version = "^3.49.0" }
boto3 = "^1.34.0"
psycopg2-binary = "^2.9.9"
sqlalchemy = "^2.0.28"
python-multipart = "^0.0.9"
pillow = "^10.2.0"
numpy = "^1.26.4"
pandas = "^2.2.0"
pyyaml = "^6.0.1"
scipy = "^1.12.0"
scikit-learn = "^1.4.0"
omegaconf = "^2.3.0"
httpx = "^0.27.0"
python-dotenv = "^1.0.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.1.0"
pytest-asyncio = "^0.23.5"
pytest-cov = "^5.0.0"
httpx = "^0.27.0"
ruff = "^0.3.0"
mypy = "^1.9.0"
types-pyyaml = "^6.0.12"
types-pillow = "^9.5.0"
pre-commit = "^3.7.0"

[tool.poetry.group.airflow.dependencies]
apache-airflow = { extras = ["postgres"], version = "^2.8.0" }

[tool.poetry.group.fiftyone.dependencies]
fiftyone = "^0.23.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# ─── Ruff ─────────────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "RUF"]
ignore = ["E501", "B008", "N812"]

[tool.ruff.lint.isort]
known-first-party = ["training", "api", "monitoring"]

# ─── Mypy ─────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
warn_unused_imports = true
warn_return_any = false
disallow_untyped_defs = false

# ─── Pytest ───────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
